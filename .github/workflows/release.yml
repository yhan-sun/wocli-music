name: Build portable release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release after all builds and smoke tests pass
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: portable-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - id: version
        name: Validate release version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          uv run python - <<'PY'
          import os
          import tomllib
          from pathlib import Path
          from wocli_music import __version__
          assert tomllib.loads(Path('pyproject.toml').read_text())['project']['version'] == __version__
          if os.environ['REF_TYPE'] == 'tag':
              assert os.environ['REF_NAME'] == 'v' + __version__
          assert Path(f'docs/releases/v{__version__}.md').is_file()
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={__version__}\n')
          PY

  binary:
    needs: test
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: ubuntu-22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.test.outputs.version }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.12"
      - name: Install Linux build-time audio backend
        if: runner.os == 'Linux'
        run: |
          sudo sed -n 's/^deb /deb-src /p' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/wocli-src.list
          sudo apt-get update
          sudo apt-get install --yes mpv
      - name: Install macOS build-time audio backend
        if: runner.os == 'macOS'
        run: brew install mpv
      - run: uv sync --locked --group build --group dev
      - name: Freeze Python, mpv and native dependencies; collect licenses and sources
        run: uv run --group build python scripts/build_binary.py
      - name: Extract and test the actual archive without tools on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/portable"
          tar -xzf "dist/wocli-music-${VERSION}-${TARGET_PLATFORM}.tar.gz" -C "$RUNNER_TEMP/portable"
          uv run python scripts/smoke_binary.py "$RUNNER_TEMP/portable/wocli-music-${VERSION}-${TARGET_PLATFORM}/wocli"
      - name: Test playback in a clean Linux container without Python or mpv installed
        if: runner.os == 'Linux'
        run: |
          uv run python scripts/smoke_binary.py "$RUNNER_TEMP/portable/wocli-music-${VERSION}-${TARGET_PLATFORM}/wocli" --docker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 7

  python:
    needs: test
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.4"
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run python scripts/build_release.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-python
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [test, binary, python]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.test.outputs.version }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify platform checksums and generate the complete manifest
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('dist')
          for manifest in root.glob('*.sha256'):
              expected, name = manifest.read_text().strip().split(maxsplit=1)
              assert hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, name
          assets = sorted([*root.glob('*.tar.gz'), *root.glob('*.whl')])
          assert len(assets) == 8, [asset.name for asset in assets]
          (root / 'SHA256SUMS').write_text(''.join(
              f'{hashlib.sha256(asset.read_bytes()).hexdigest()}  {asset.name}\n' for asset in assets))
          PY
      - name: Upload all assets before publishing
        run: |
          gh release create "v${VERSION}" dist/*.tar.gz dist/*.whl dist/SHA256SUMS \
            --draft --target "$RELEASE_COMMIT" --title "wocli-music v${VERSION}" \
            --notes-file "docs/releases/v${VERSION}.md"
          gh release edit "v${VERSION}" --draft=false --latest
