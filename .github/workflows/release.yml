name: Build native release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after all native builds and smoke tests pass
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - name: Install Rust
        run: rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt && rustup default 1.93.1
      - name: Test distribution gateway
        run: |
          node --test cloudflare/worker.test.mjs
          python3 scripts/test_distribution_install.py
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$REF_TYPE" != tag || test "$REF_NAME" = "v$VERSION"
          test -f "docs/releases/v$VERSION.md"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  binary:
    needs: test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: ubuntu-22.04
            platform: linux-x86_64
          - runner: windows-latest
            platform: windows-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.test.outputs.version }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Linux build dependencies and obtain ALSA source
        if: runner.os == 'Linux'
        run: |
          sudo sed -n 's/^deb /deb-src /p' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/wocli-src.list
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev patchelf
          mkdir -p "$RUNNER_TEMP/alsa-source"
          cd "$RUNNER_TEMP/alsa-source"
          apt-get source --download-only alsa-lib
      - name: Install Rust
        run: rustup toolchain install 1.93.1 --profile minimal && rustup default 1.93.1
      - name: Test Windows playback and running-executable replacement
        if: runner.os == 'Windows'
        timeout-minutes: 6
        run: cargo test --locked --all-targets
      - run: cargo build --release --locked
      - name: Verify Windows installer and immediate command availability
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test_install_windows.ps1 -BinaryPath ./target/release/wocli.exe
      - name: Verify installer in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/test_install_windows.ps1 -BinaryPath ./target/release/wocli.exe
      - name: Package native player, notices and small dependency source archive
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            python3 scripts/build_native.py --platform "$TARGET_PLATFORM" --alsa-source "$RUNNER_TEMP/alsa-source"
          else
            python3 scripts/build_native.py --platform "$TARGET_PLATFORM"
          fi
      - name: Verify extracted player with no runtime programs on PATH
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/native"
          if [ "$RUNNER_OS" = Windows ]; then
            unzip "dist/wocli-music-${VERSION}-${TARGET_PLATFORM}.zip" -d "$RUNNER_TEMP/native"
            python3 scripts/smoke_binary.py "$RUNNER_TEMP/native/wocli-music-${VERSION}-${TARGET_PLATFORM}/wocli.exe"
          else
            tar -xzf "dist/wocli-music-${VERSION}-${TARGET_PLATFORM}.tar.gz" -C "$RUNNER_TEMP/native"
            python3 scripts/smoke_binary.py "$RUNNER_TEMP/native/wocli-music-${VERSION}-${TARGET_PLATFORM}/wocli"
          fi
      - name: Test native decoding in clean Linux without Python, mpv or ALSA installed
        if: runner.os == 'Linux'
        run: python3 scripts/smoke_binary.py "$RUNNER_TEMP/native/wocli-music-${VERSION}-${TARGET_PLATFORM}/wocli" --docker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  widgets-preview:
    needs: [test, binary]
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      VERSION: ${{ needs.test.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: native-windows-x86_64
          path: native-dist
      - name: Build preview with the tested release player
        shell: pwsh
        run: |
          $bundle = "wocli-music-$env:VERSION-windows-x86_64"
          Expand-Archive "native-dist/$bundle.zip" -DestinationPath "$env:RUNNER_TEMP/native"
          $native = Join-Path "$env:RUNNER_TEMP/native" $bundle
          ./scripts/build_windows_widgets.ps1 -Architecture x64 -PlayerBinary "$native/wocli.exe" -NativeBundleDirectory $native
          $preview = './artifacts/system-widgets-preview/x64'
          $source = Get-Item "native-dist/$bundle-sources.zip"
          Copy-Item -LiteralPath $source.FullName -Destination $preview
          $hash = (Get-FileHash -LiteralPath $source.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($source.Name)" | Add-Content -LiteralPath "$preview/SHA256SUMS" -Encoding utf8
      - name: Verify development package registration
        shell: powershell
        run: ./scripts/test_windows_widgets_package.ps1 -PreviewDirectory ./artifacts/system-widgets-preview/x64
      - name: Archive the preview
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path widget-dist | Out-Null
          Compress-Archive -Path './artifacts/system-widgets-preview/x64/*' -DestinationPath "widget-dist/wocli-system-widgets-preview-$env:VERSION-windows-x86_64.zip"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: widgets-preview-windows-x86_64
          path: widget-dist/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [test, binary, widgets-preview]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.test.outputs.version }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: widgets-preview-windows-x86_64
          path: widget-dist
      - name: Verify and collect checksums
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('dist')
          archives = sorted(root.glob('*.tar.gz')) + sorted(root.glob('*.zip'))
          assert len(archives) == 8
          for archive in archives:
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              assert archive.with_suffix(archive.suffix + '.sha256').read_text().split()[0] == digest
          previews = list(Path('widget-dist').glob('*.zip'))
          assert len(previews) == 1
          previews[0].rename(root / previews[0].name)
          archives += [root / previews[0].name]
          (root / 'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in archives))
          PY
      - name: Publish only after all platforms pass
        run: |
          gh release create "v${VERSION}" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --draft --target "$RELEASE_COMMIT" --title "wocli-music v${VERSION} · Native Rust" \
            --notes-file "docs/releases/v${VERSION}.md"
          gh release edit "v${VERSION}" --draft=false --latest
