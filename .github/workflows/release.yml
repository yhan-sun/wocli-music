name: Build native release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after all native builds and smoke tests pass
        type: boolean
        default: false

permissions:
  contents: read
concurrency:
  group: native-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: sudo apt-get update && sudo apt-get install --yes libasound2-dev
      - name: Install Rust
        run: rustup toolchain install 1.93.1 --profile minimal --component clippy,rustfmt && rustup default 1.93.1
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "$REF_TYPE" != tag || test "$REF_NAME" = "v$VERSION"
          test -f "docs/releases/v$VERSION.md"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  binary:
    needs: test
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos-arm64
          - runner: macos-15-intel
            platform: macos-x86_64
          - runner: ubuntu-22.04
            platform: linux-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.test.outputs.version }}
      TARGET_PLATFORM: ${{ matrix.platform }}
      MACOSX_DEPLOYMENT_TARGET: "15.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Linux build dependencies and obtain ALSA source
        if: runner.os == 'Linux'
        run: |
          sudo sed -n 's/^deb /deb-src /p' /etc/apt/sources.list | sudo tee /etc/apt/sources.list.d/wocli-src.list
          sudo apt-get update
          sudo apt-get install --yes libasound2-dev patchelf
          mkdir -p "$RUNNER_TEMP/alsa-source"
          cd "$RUNNER_TEMP/alsa-source"
          apt-get source --download-only alsa-lib
      - name: Install Rust
        run: rustup toolchain install 1.93.1 --profile minimal && rustup default 1.93.1
      - run: cargo build --release --locked
      - name: Package native player, notices and small dependency source archive
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            python3 scripts/build_native.py --platform "$TARGET_PLATFORM" --alsa-source "$RUNNER_TEMP/alsa-source"
          else
            python3 scripts/build_native.py --platform "$TARGET_PLATFORM"
          fi
      - name: Verify extracted player with no runtime programs on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/native"
          tar -xzf "dist/wocli-music-${VERSION}-${TARGET_PLATFORM}.tar.gz" -C "$RUNNER_TEMP/native"
          python3 scripts/smoke_binary.py "$RUNNER_TEMP/native/wocli-music-${VERSION}-${TARGET_PLATFORM}/wocli"
      - name: Test native decoding in clean Linux without Python, mpv or ALSA installed
        if: runner.os == 'Linux'
        run: python3 scripts/smoke_binary.py "$RUNNER_TEMP/native/wocli-music-${VERSION}-${TARGET_PLATFORM}/wocli" --docker
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [test, binary]
    if: startsWith(github.ref, 'refs/tags/v') || inputs.publish
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.test.outputs.version }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: native-*
          path: dist
          merge-multiple: true
      - name: Verify and collect checksums
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path('dist')
          archives = sorted(root.glob('*.tar.gz'))
          assert len(archives) == 6
          for archive in archives:
              digest = hashlib.sha256(archive.read_bytes()).hexdigest()
              assert archive.with_suffix(archive.suffix + '.sha256').read_text().split()[0] == digest
          (root / 'SHA256SUMS').write_text(''.join(f'{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n' for p in archives))
          PY
      - name: Publish only after all platforms pass
        run: |
          gh release create "v${VERSION}" dist/*.tar.gz dist/SHA256SUMS \
            --draft --target "$RELEASE_COMMIT" --title "wocli-music v${VERSION} · Native Rust" \
            --notes-file "docs/releases/v${VERSION}.md"
          gh release edit "v${VERSION}" --draft=false --latest
