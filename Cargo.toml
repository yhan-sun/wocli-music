[package]
name = "wocli-music"
version = "0.3.9"
edition = "2021"
rust-version = "1.93"
description = "A compact terminal music player with native audio playback"
repository = "https://github.com/yhan-sun/wocli-music"
default-run = "wocli"

[[bin]]
name = "wocli"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
crossterm = { version = "0.28", default-features = false, features = ["events", "windows"] }
csv = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
fs2 = "0.4"
md-5 = "0.10"
rand = { version = "0.8", default-features = false, features = ["std", "std_rng"] }
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
rmcp = { version = "3.6", default-features = false, features = ["server", "transport-io"] }
rodio = { version = "0.21.1", default-features = false, features = ["playback", "symphonia-mp3", "symphonia-flac", "symphonia-aac", "symphonia-isomp4", "symphonia-wav", "symphonia-pcm"] }
rquickjs = { version = "0.14", default-features = false, features = ["std"] }
rusqlite = { version = "0.32", features = ["bundled"] }
schemars = "1.2"
self-replace = "1.5"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "sync", "time", "signal", "macros"] }
unicode-normalization = "0.1"
unicode-width = "0.2"
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.25"
objc = "0.2.7"

[target."cfg(windows)".dependencies]
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_UI_Accessibility", "Win32_Foundation"] }
windows-sys = { version = "0.52", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Foundation", "Win32_System_Threading", "Win32_System_LibraryLoader", "Win32_Security", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
