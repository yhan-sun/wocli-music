name: Build system Widgets preview

on:
  push:
    branches: [codex/windows-system-widgets]
    paths:
      - windows/widgets/**
      - src/**
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - scripts/build_windows_widgets.ps1
      - scripts/test_windows_widgets.ps1
      - .github/workflows/windows-widgets.yml
  pull_request:
    paths:
      - windows/widgets/**
      - src/**
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - scripts/build_windows_widgets.ps1
      - scripts/test_windows_widgets.ps1
      - .github/workflows/windows-widgets.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-widgets-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # pull_request.branches filters the target branch, not the source branch.
    if: github.event_name != 'pull_request' || github.head_ref == 'codex/windows-system-widgets'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Check provider COM activation before the full player build
        shell: pwsh
        run: |
          $providerDirectory = Join-Path $env:RUNNER_TEMP 'wocli-widgets-preflight'
          dotnet publish ./windows/widgets/Wocli.Widgets/Wocli.Widgets.csproj --configuration Release --runtime win-x64 --self-contained true --output $providerDirectory -p:Platform=x64 -p:WindowsAppSDKSelfContained=false -p:PublishSingleFile=false -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/test_windows_widgets.ps1 -ProviderPath (Join-Path $providerDirectory 'Wocli.Widgets.exe')
      - name: Build matching development player
        shell: pwsh
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.93.1 build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.93.1 test --locked --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_native.py --platform windows-x86_64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test core, publish provider and validate unsigned MSIX with signed runtime dependency
        shell: pwsh
        run: |
          $nativeBundle = Get-ChildItem ./build/native -Directory | Where-Object Name -Match 'windows-x86_64$' | Select-Object -First 1
          if (-not $nativeBundle) { throw 'Native player notices bundle not found' }
          ./scripts/build_windows_widgets.ps1 -Architecture x64 -PlayerBinary ./target/release/wocli.exe -NativeBundleDirectory $nativeBundle.FullName
          $previewDirectory = './artifacts/system-widgets-preview/x64'
          $sourceArchives = @(Get-ChildItem ./dist/*-windows-x86_64-sources.zip -File)
          if ($sourceArchives.Count -ne 1) { throw 'Expected exactly one matching dependency source archive' }
          foreach ($sourceArchive in $sourceArchives) {
            Copy-Item -LiteralPath $sourceArchive.FullName -Destination $previewDirectory
            $sourceHash = (Get-FileHash -LiteralPath $sourceArchive.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$sourceHash  $($sourceArchive.Name)" | Add-Content -LiteralPath "$previewDirectory/SHA256SUMS" -Encoding utf8
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: system-widgets-preview-x64
          path: artifacts/system-widgets-preview/x64/*
          if-no-files-found: error
          retention-days: 7
