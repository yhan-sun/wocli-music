name: Build system Widgets preview

on:
  push:
    branches: [codex/windows-system-widgets]
    paths:
      - windows/widgets/**
      - src/**
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - scripts/build_windows_widgets.ps1
      - .github/workflows/windows-widgets.yml
  pull_request:
    paths:
      - windows/widgets/**
      - src/**
      - Cargo.toml
      - Cargo.lock
      - build.rs
      - scripts/build_windows_widgets.ps1
      - .github/workflows/windows-widgets.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: system-widgets-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # pull_request.branches filters the target branch, not the source branch.
    if: github.event_name != 'pull_request' || github.head_ref == 'codex/windows-system-widgets'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '8.0.x'
      - name: Build matching development player
        shell: pwsh
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.93.1 build --release --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo +1.93.1 test --locked --all-targets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_native.py --platform windows-x86_64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test core, publish provider and validate unsigned MSIX with signed runtime dependency
        shell: pwsh
        run: |
          $nativeBundle = Get-ChildItem ./build/native -Directory | Where-Object Name -Match 'windows-x86_64$' | Select-Object -First 1
          if (-not $nativeBundle) { throw 'Native player notices bundle not found' }
          ./scripts/build_windows_widgets.ps1 -Architecture x64 -PlayerBinary ./target/release/wocli.exe -NativeBundleDirectory $nativeBundle.FullName
          Copy-Item ./dist/*-windows-x86_64-sources.zip ./artifacts/system-widgets-preview/x64/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: system-widgets-preview-x64
          path: artifacts/system-widgets-preview/x64/*
          if-no-files-found: error
          retention-days: 7
